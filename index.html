<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JFM AutoManager — sistema de ventas e inventario de vehiculos de EJGH AUTO IMPORT SRL" />
    <meta name="theme-color" content="#1A2030" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo: grotesca industrial (linaje de rotulacion vial) para toda la
      interfaz. JetBrains Mono: cifras tabulares para montos, VIN y chasis.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <title>JFM AutoManager</title>

    <script>
      // Fija el tema antes del primer pintado: sin esto, un usuario en modo
      // oscuro ve un destello blanco en cada carga.
      (function () {
        try {
          var saved = localStorage.getItem('jfm-theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

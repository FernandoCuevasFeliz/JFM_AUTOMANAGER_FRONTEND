services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_IMAGEKIT_PUBLIC_KEY: ${VITE_IMAGEKIT_PUBLIC_KEY:-}
        VITE_IMAGEKIT_URL_ENDPOINT: ${VITE_IMAGEKIT_URL_ENDPOINT:-}
        VITE_IMAGEKIT_AUTH_ENDPOINT: ${VITE_IMAGEKIT_AUTH_ENDPOINT:-/uploads/imagekit-auth}
        VITE_COMPANY_NAME: ${VITE_COMPANY_NAME:-EJGH AUTO IMPORT SRL}
        VITE_COMPANY_RNC: ${VITE_COMPANY_RNC:-}
        VITE_COMPANY_ADDRESS: ${VITE_COMPANY_ADDRESS:-}
        VITE_COMPANY_CITY: ${VITE_COMPANY_CITY:-Republica Dominicana}
        VITE_COMPANY_PHONE: ${VITE_COMPANY_PHONE:-}
        VITE_COMPANY_EMAIL: ${VITE_COMPANY_EMAIL:-}
        VITE_COMPANY_WEBSITE: ${VITE_COMPANY_WEBSITE:-}
        VITE_INVOICE_TAX_RATE: ${VITE_INVOICE_TAX_RATE:-0}
        VITE_INVOICE_TAX_LABEL: ${VITE_INVOICE_TAX_LABEL:-ITBIS}
        VITE_INVOICE_TAX_INCLUDED: ${VITE_INVOICE_TAX_INCLUDED:-true}
        VITE_INVOICE_FOOTER_NOTE: ${VITE_INVOICE_FOOTER_NOTE:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
